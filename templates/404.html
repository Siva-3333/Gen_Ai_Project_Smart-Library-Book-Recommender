{% extends "base.html" %}

{% block title %}Page Not Found &mdash; Smart Library{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5">
    <div class="mb-3">
      <i class="bi bi-book display-1 text-primary opacity-50"></i>
    </div>
    <h1 class="display-4 fw-bold">404 &mdash; Page Not Found</h1>
    <p class="lead text-muted mx-auto mb-4" style="max-width: 500px;">
      {{ message or "The page or volume you are looking for does not exist or may have been moved." }}
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('books.index') }}" class="btn btn-primary-sl px-4">
        <i class="bi bi-house-door me-1"></i> Return Home
      </a>
      <a href="{{ url_for('books.explore') }}" class="btn btn-outline-secondary px-4">
        <i class="bi bi-compass me-1"></i> Explore Catalog
      </a>
    </div>
  </div>
</div>
{% endblock %}
